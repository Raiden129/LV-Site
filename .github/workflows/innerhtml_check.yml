name: InnerHTML Safety Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-innerhtml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for unsafe innerHTML additions
        run: bash scripts/check-unsafe-innerhtml.sh
